<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Oakwoods MAR Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a tablet-first staff app. Dark app bar, demo banner, one working view at a time. */
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --sunk:#EEF2F3; --fg:#17262B; --muted:#4A5A60; --line:#D5DDE0;
  --bar:#17262B; --bar-fg:#FFFFFF; --bar-muted:#C9D4D7;
  --accent:#1F5C68; --accent-fg:#FFFFFF; --accent-soft:#E3EEF1;
  --ok:#1E5631; --ok-bg:#E6F2EA; --ok-line:#2E7D47;
  --warn:#5C3B00; --warn-bg:#FDE7C2; --warn-line:#8A5A00;
  --due:#123F73; --due-bg:#EAF2FC; --due-line:#1D5FA8;
  --refuse:#7A3606; --refuse-bg:#FFF1E6; --refuse-line:#B8530F;
  --danger:#7A1F1F; --danger-line:#A33A3A;
  --demo:#4A2E7A; --demo-bg:#EFE9FA;
  --font:'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A1D; --surface:#17262B; --sunk:#1D3036; --fg:#E8EEF0; --muted:#A9B8BD; --line:#2E444B;
  --bar:#0A1214; --bar-fg:#E8EEF0; --bar-muted:#A9B8BD;
  --accent:#5FB3C2; --accent-fg:#0A1F24; --accent-soft:#1C3A41;
  --ok:#9FD9B0; --ok-bg:#16352193; --ok-line:#4FA86A;
  --warn:#F7D08A; --warn-bg:#3D2C0C; --warn-line:#C99232;
  --due:#A9CCF5; --due-bg:#152A44; --due-line:#5B95D6;
  --refuse:#F5B98C; --refuse-bg:#3A2213; --refuse-line:#D27A3C;
  --danger:#F2A3A3; --danger-line:#C96060;
  --demo:#D6C6F5; --demo-bg:#2A2140; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1A1D; --surface:#17262B; --sunk:#1D3036; --fg:#E8EEF0; --muted:#A9B8BD; --line:#2E444B;
  --bar:#0A1214; --bar-fg:#E8EEF0; --bar-muted:#A9B8BD;
  --accent:#5FB3C2; --accent-fg:#0A1F24; --accent-soft:#1C3A41;
  --ok:#9FD9B0; --ok-bg:#16352193; --ok-line:#4FA86A;
  --warn:#F7D08A; --warn-bg:#3D2C0C; --warn-line:#C99232;
  --due:#A9CCF5; --due-bg:#152A44; --due-line:#5B95D6;
  --refuse:#F5B98C; --refuse-bg:#3A2213; --refuse-line:#D27A3C;
  --danger:#F2A3A3; --danger-line:#C96060;
  --demo:#D6C6F5; --demo-bg:#2A2140; color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--due-line);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{background:var(--bar);color:var(--bar-fg)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.brand{font-weight:700;font-size:19px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who small{color:var(--bar-muted)}
.demo-band{background:var(--demo-bg);color:var(--demo);border-bottom:1px solid var(--line)}
.demo-band .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px;font-size:15px}
.demo-band label{display:flex;gap:8px;align-items:center;font-weight:700}
.paper-band{background:var(--accent-soft);border-bottom:1px solid var(--line)}
.paper-band .wrap{padding-block:9px;font-size:16px}
main{max-width:1240px;margin:0 auto;padding-block:18px 40px}
nav.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--danger);border-color:var(--danger-line)}
.btn.ghost-light{background:transparent;color:var(--bar-fg);border-color:#5B6C72}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:40px;padding:6px 12px;font-size:15px}
h1{font-size:26px;margin:0;text-wrap:balance}
h2{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:14px 0}
.count{border-radius:12px;padding:12px 16px;border:1px solid var(--line);background:var(--surface)}
.count b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.count.warn{background:var(--warn-bg);border:2px solid var(--warn-line);color:var(--warn)}
.count.due{background:var(--due-bg);border:2px solid var(--due-line);color:var(--due)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:72px minmax(0,1.1fr) minmax(0,1.6fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;width:100%;cursor:pointer}
.item.warn{border:2px solid var(--warn-line)} .item.due{border:2px solid var(--due-line)} .item.up{border-style:dashed}
.item .t{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:720px){.item{grid-template-columns:60px minmax(0,1fr)}.item>:nth-child(3),.item>:nth-child(4){grid-column:2}}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px;white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.due{background:var(--due-bg);color:var(--due)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.refuse{background:var(--refuse-bg);color:var(--refuse)}
.pill.plain{background:var(--sunk);color:var(--muted)}
.ident{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.ident.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;flex:none}
.allergy{border-radius:10px;padding:8px 14px;font-weight:700;border:2px solid}
.allergy.nka{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.allergy.unknown{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.allergy.has{background:var(--refuse-bg);color:var(--danger);border-color:var(--danger-line)}
.gridbox{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.mar{border-collapse:collapse;width:100%;min-width:720px}
table.mar th,table.mar td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px;vertical-align:middle}
table.mar th:first-child,table.mar td:first-child{border-left:0}
table.mar thead th{background:var(--sunk);font-size:18px;font-variant-numeric:tabular-nums}
table.mar td.med{min-width:260px}
.med b{display:block;font-size:18px}
.cell{width:100%;min-height:70px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;cursor:pointer;border:2px solid transparent;padding:6px;text-align:center}
.cell small{font-weight:400;font-size:14px}
.cell.given{background:var(--accent);color:var(--accent-fg)}
.cell.refused{background:var(--refuse-bg);color:var(--refuse);border-color:var(--refuse-line)}
.cell.due{background:var(--due-bg);color:var(--due);border:3px solid var(--due-line)}
.cell.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.cell.up{background:var(--surface);color:var(--muted);border:2px dashed var(--line)}
.none{color:var(--muted);font-size:14px;text-align:center}
.badge-pending{display:inline-block;margin-top:6px;background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:3px 8px;font-size:14px;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:15px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;display:inline-block;border:2px solid}
.two{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
form{display:flex;flex-direction:column;gap:16px}
fieldset{border:0;margin:0;padding:0}
legend,.lbl{font-weight:700;margin-bottom:8px;display:block}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px}
input[type=text],input[type=time],select,textarea{border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);min-height:48px;font-weight:400}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:12px 14px;font-weight:400}
.check input{width:26px;height:26px;flex:none;accent-color:var(--accent);margin:0}
.note{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:16px}
.alert{border-radius:10px;padding:12px 14px;font-weight:700;border:2px solid}
.alert.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.alert.err{background:var(--refuse-bg);color:var(--danger);border-color:var(--danger-line)}
.alert.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.kv small{display:block;color:var(--muted)}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.2fr) 230px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.hrow.head{background:var(--sunk);font-weight:700;color:var(--muted);font-size:15px}
.hrow.miss{background:var(--warn-bg)}
@media (max-width:860px){.hrow{grid-template-columns:60px minmax(0,1fr)}.hrow>:nth-child(n+3){grid-column:2}.hrow.head{display:none}}
.progress{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.progress i{display:block;height:100%;background:var(--accent)}
.letter{border:1px solid var(--line);border-radius:10px;background:var(--sunk);min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.letter img{max-width:100%;max-height:480px;display:block}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp>div{border-radius:10px;padding:12px 14px;background:var(--sunk)}
.cmp>div.new{background:var(--accent-soft);border:2px solid var(--accent)}
.log{display:flex;flex-direction:column}
.log div{display:grid;grid-template-columns:70px 170px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
@media (max-width:720px){.log div{grid-template-columns:60px minmax(0,1fr)}.log div>:nth-child(3){grid-column:2}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-height:44px}
.pcard:hover{border-color:var(--muted)}
.pcard.warn{border:2px solid var(--warn-line)} .pcard.due{border:2px solid var(--due-line)}
.pc-top{display:flex;gap:12px;align-items:center;width:100%}
.pc-top>span:last-child{display:flex;flex-direction:column}
.pc-name{font-size:20px}
.pc-lines{font-size:16px;line-height:1.5}
.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.users button{text-align:left;padding:16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.users button b{display:block;font-size:19px}
@media print{.bar,.demo-band,.paper-band,nav.tabs,.noprint,.toast{display:none!important}body{background:#fff;color:#000}.panel{border:1px solid #999}.medsheet{break-after:page}.gridbox{overflow:visible}table.mar{min-width:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="bar"><div class="wrap">
  <div class="brand">Ardington House · Medication</div>
  <div class="who"><span>Signed in: <strong id="who-name"></strong> <small id="who-role"></small></span>
    <button class="btn ghost-light small" data-act="signin" type="button">Switch user</button></div>
</div></div>
<div class="demo-band"><div class="wrap">
  <span><strong>Demonstration.</strong> Fictional people and medicines. Not a medication record. Nothing is saved when you reload.</span>
  <span style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
    <label for="clock">Demo time
      <select id="clock"></select></label>
    <button class="btn small" data-act="reset" type="button">Reset demo</button>
  </span>
</div></div>
<div class="paper-band"><div class="wrap"><strong>The paper MAR is the official record.</strong> Sign the paper chart first, then confirm the entry here.</div></div>

<main class="wrap" id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const WINDOW=60;              // demo placeholder: minutes either side of the due time. Real values per medicine come from the medicines lead.
const DAY_END=20*60;
const LIQ_TOL=10;            // demo placeholder: ml difference allowed when reading a bottle. Real value from the medicines lead.          // demo placeholder: day shift ends 20:00
const USERS=[
  {id:'ts1',name:'Test Staff 1',init:'TS1',role:'Day staff'},
  {id:'ts2',name:'Test Staff 2',init:'TS2',role:'Day staff'},
  {id:'tn1',name:'Test Night Staff 1',init:'TN1',role:'Night staff'},
  {id:'rm',name:'Registered Manager',init:'RM',role:'Manager',approver:true},
  {id:'dm',name:'Deputy Manager',init:'DM',role:'Manager',approver:true},
];
// Outcome codes follow the key on the Oakwoods CM11 paper MAR. "uses" = the dose comes out of stock.
const OUTCOMES=[
  {code:'Given',label:'Given',short:'Given',uses:true},
  {code:'R',label:'R · Refused & destroyed',short:'R · Refused',uses:true},
  {code:'H',label:'H · Hospital',short:'H · Hospital',uses:false},
  {code:'V',label:'V · Vomit / nausea',short:'V · Vomit',uses:true},
  {code:'S',label:'S · Social leave',short:'S · Leave',uses:false},
  {code:'N',label:'N · No stock',short:'N · No stock',uses:false},
  {code:'W',label:'W · Withheld (authorised)',short:'W · Withheld',uses:false},
  {code:'O',label:'O · Other (see notes)',short:'O · Other',uses:true},
];
const OC=c=>OUTCOMES.find(o=>o.code===c)||OUTCOMES[0];
let S, view, now, user;

function seed(){
  S={
    people:[
      {id:'P-0001',name:'Test Person Alpha',dob:'01/01/1990',init:'TA',allergy:'nka',mar:{start:'19/10/26',startDay:19,sheets:1}},
      {id:'P-0002',name:'Test Person Bravo',dob:'02/02/1992',init:'TB',allergy:'unknown',mar:{start:'19/10/26',startDay:19,sheets:1}},
      {id:'P-0003',name:'Test Person Charlie',dob:'03/03/1985',init:'TC',allergy:'has',allergyDetail:'Fictorin: rash',mar:{start:'19/10/26',startDay:19,sheets:1}},
      {id:'P-0004',name:'Test Person Delta',dob:'04/04/1998',init:'TD',allergy:'nka',mar:{start:'19/10/26',startDay:19,sheets:1}},
    ],
    plans:[
      P('ORD-01',1,'P-0001','Testamol','500 mg tablet','Oral','Swallow with water',{'08:00':1,'20:00':1},'tablet'),
      P('ORD-02',1,'P-0001','Calmexil','5 mg in 5 ml oral solution','Oral','Measure with oral syringe',{'08:00':10},'ml'),
      P('ORD-03',1,'P-0001','Dormanol','20 mg capsule','Oral','',{'13:00':1,'18:00':1},'capsule'),
      P('ORD-04',1,'P-0002','Placebrine','10 mg tablet','Oral','',{'08:00':1,'20:00':2},'tablet'),
      P('ORD-05',1,'P-0003','Calmexil','5 mg in 5 ml oral solution','Oral','',{'09:00':5},'ml'),
      P('ORD-06',1,'P-0003','Testamol','500 mg tablet','Oral','',{'13:00':1},'tablet'),
      P('ORD-07',1,'P-0004','Dormanol','20 mg capsule','Oral','1 in the morning, 1 in the afternoon, 2 in the evening',{'08:00':1,'13:00':1,'18:00':2},'capsule'),
    ],
    // Stock per medicine (kept across prescription versions). cf = carried forward from the previous sheet.
    stock:{'ORD-02':{liquid:true,cf:150,unopened:[200],moves:[]},'ORD-05':{liquid:true,cf:100,unopened:[],moves:[]},'ORD-01':{cf:28,moves:[]},'ORD-03':{cf:14,moves:[]},'ORD-04':{cf:20,moves:[]},'ORD-06':{cf:16,moves:[]},'ORD-07':{cf:12,moves:[]}},
    slots:[], log:[], events:[], changes:[], seq:0,
    handover:{handedBy:null,handedAt:null,signs:{},done:null},
  };
  S.plans.forEach(p=>p.times.forEach(t=>addSlot(p,t)));
  S.seeds=[
    ['P-0001|ORD-01|08:00','Given','ts1','08:04','','',  '',480+4,1,27],
    ['P-0001|ORD-02|08:00','R','ts1','08:10','','','Declined, offered again 08:40, declined again. Dose destroyed.',480+12,10,140],
    ['P-0002|ORD-04|08:00','Given','ts2','08:05','','','',480+15,1,18],   // expected 19: demo stock discrepancy
    ['P-0003|ORD-05|09:00','Given','ts1','09:02','','','',540+4,5,95],
  ];
  applySeeds();
  // Delta 08:00 deliberately left with no entry
  log(480,'System','Doses for Sun 25 Oct created from current prescriptions');
}
function applySeeds(){S.seeds=S.seeds.filter(x=>{if(x[7]<=now){rec(...x);return false;}return true;});}
function P(order,v,pid,name,strength,route,instr,sched,unit){
  const times=Object.keys(sched).sort((a,b)=>mins(a)-mins(b));
  const qs=times.map(t=>sched[t]);
  const dose=qs.every(q=>q===qs[0])?doseUnit(qs[0],unit):times.map(t=>doseUnit(sched[t],unit)+' at '+t).join(', ');
  return {order,v,vid:order+'-v'+v,pid,name,strength,route,instr,sched,times,unit,dose,state:'Current'};
}
function doseUnit(q,unit){return unit==='ml'?q+' ml':q+' '+unit+(Number(q)===1?'':'s');}
const doseAtSlot=s=>{const pl=planOf(s);return doseUnit(pl.sched[s.time],pl.unit);};
// Running stock: carried forward + received - returned - used; each entered count resets the balance to what was counted.
// Liquids: the bottle in use (approximate level) plus each unopened bottle (exact).
function liquidState(order){
  const st=S.stock[order];
  const ev=[...st.moves.map(m=>({...m,k:m.type})),...S.slots.filter(s=>s.order===order&&s.entry).map(s=>({at:s.entry.at,seq:s.entry.seq,k:'entry',q:s.entry.used||0,c:s.entry.count}))].sort((a,b)=>a.at-b.at||a.seq-b.seq);
  let inUse=st.cf,unopened=[...st.unopened],openedAt=null,openedBy=null;
  ev.forEach(e=>{
    if(e.k==='received')for(let i=0;i<e.qty;i++)unopened.push(e.vol);
    else if(e.k==='returned')for(let i=0;i<e.qty;i++){const j=unopened.indexOf(e.vol);if(j>=0)unopened.splice(j,1);}
    else if(e.k==='opened'){const j=unopened.indexOf(e.vol);if(j>=0)unopened.splice(j,1);inUse=e.vol;openedAt=e.at;openedBy=e.by;}
    else if(e.k==='entry'&&inUse!=null){inUse-=e.q;if(e.c!=null)inUse=e.c;}
  });
  return {inUse,unopened,openedAt,openedBy};
}
function balance(order){
  const st=S.stock[order];if(!st)return null;
  if(st.liquid)return liquidState(order).inUse;
  const ev=[...st.moves.map(m=>({at:m.at,seq:m.seq,k:m.type,q:m.qty})),...S.slots.filter(s=>s.order===order&&s.entry).map(s=>({at:s.entry.at,seq:s.entry.seq,k:'entry',q:s.entry.used||0,c:s.entry.count}))].sort((a,b)=>a.at-b.at||a.seq-b.seq);
  let bal=st.cf;
  ev.forEach(e=>{if(st.liquid){if(e.k==='opened')bal=e.q;else if(e.k==='entry'){bal-=e.q;if(e.c!=null)bal=e.c;}}
    else if(e.k==='received')bal+=e.q;else if(e.k==='returned')bal-=e.q;else if(e.k==='entry'){bal-=e.q;if(e.c!=null)bal=e.c;}});
  return bal;
}
const isFlag=(order,c,e)=>c!=null&&e!=null&&(S.stock[order]&&S.stock[order].liquid?Math.abs(c-e)>LIQ_TOL:c!==e);

// The CM11 holds 4 medicines per page. Position follows the order medicines were written onto the sheet.
const DEMO_DAY=25;
function paperRef(s,alt){

  return `CM11 · started ${p.mar.start} · Sheet 1 of ${p.mar.sheets} · Page ${Math.floor(i/4)+1} · Medicine ${i%4+1} (${pl.name}) · ${s.time} row · Week ${week}, column 25 (Sun 25 Oct)`;
}
const stockFlags=pid=>S.slots.filter(s=>s.pid===pid&&s.entry&&s.entry.stockFlag);
function addSlot(p,t){
  const key=p.pid+'|'+p.order+'|'+t;
  if(S.slots.some(s=>s.key===key&&!s.superseded))return;
  S.slots.push({id:key+'|'+p.vid,key,pid:p.pid,order:p.order,vid:p.vid,time:t,entry:null,superseded:false});
}
function rec(key,outcome,uid,actual,chart,row,notes,at,used,count){
  const s=S.slots.find(x=>x.key===key&&!x.superseded);
  const expected=S.stock[s.order]&&count!=null?balance(s.order)-used:null;
  s.entry={outcome,by:uid,actual,chart:paperRef(s),row:'confirmed',notes,at,used,count,expected,seq:++S.seq,stockFlag:isFlag(s.order,count,expected)};
}
const mins=t=>{const [h,m]=t.split(':').map(Number);return h*60+m;};
const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=id=>USERS.find(u=>u.id===id)||{name:id,init:id};
const person=id=>S.people.find(p=>p.id===id);
const planOf=s=>S.plans.find(p=>p.vid===s.vid);
function log(at,who,text){S.log.unshift({at,who,text});}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200);}

function status(s){
  if(s.superseded)return 'superseded';
  if(s.entry)return 'recorded';
  const t=mins(s.time);
  if(now<t-WINDOW)return 'up';
  if(now<=t+WINDOW)return 'due';
  return 'warn';
}
const live=()=>S.slots.filter(s=>!s.superseded);
const pendingFor=order=>S.changes.find(c=>c.order===order&&c.status==='Pending approval');

  ${liqs.length?`<div class="gridbox" style="margin-top:12px"><table class="mar"><thead><tr><th style="text-align:left">Liquids</th><th>Bottle in use</th><th>Unopened bottles</th><th>Total on hand</th><th>Last reading</th><th>Check</th></tr></thead><tbody>${lRows}</tbody></table></div>`:''}
  <p class="muted">Tablets and capsules are counted exactly. For liquids, unopened bottles are counted exactly and the bottle in use is read from its markings, so its level and the total are approximate. A reading more than ${LIQ_TOL} ml from the expected level is flagged (demo setting).</p>`;

function recordView(id){

      <div style="display:flex;gap:8px;flex-wrap:wrap">${others.map(u=>`<button class="btn${u.role==='Night staff'?' primary':''}" type="button" data-act="quickas" data-id="${u.id}">Sign in as ${h(u.name)}</button>`).join('')}</div></div>`;
    return `<div class="panel"><b>${label}</b>${n?` <span class="pill warn">Signed for ${n} of ${ids.length}</span>`:''}

      <canvas class="sigpad" data-n="${k}" style="width:100%;height:140px;background:#fff;border:2px dashed var(--line);border-radius:10px;touch-action:none;display:block" aria-label="Signature box"></canvas>

  const both=done(0)===ids.length&&done(1)===ids.length;
  return `<section class="noprint panel" style="margin:16px 0;background:var(--sunk)"><h2 style="margin-top:0">Sign-off ${both?'<span class="pill ok">Both signatures done</span>':''}</h2>

    <div class="fields">${box(0)}${box(1)}</div></section>`;
}
function initPads(){document.querySelectorAll('canvas.sigpad').forEach(c=>{
  const r=window.devicePixelRatio||1;c.width=c.clientWidth*r;c.height=c.clientHeight*r;const x=c.getContext('2d');x.scale(r,r);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';
  let down=false;const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];};
  c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);const [a,b]=pt(e);x.beginPath();x.moveTo(a,b);});
  c.addEventListener('pointermove',e=>{if(!down)return;const [a,b]=pt(e);x.lineTo(a,b);x.stroke();c.dataset.drawn='1';});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>c.addEventListener(t,()=>{down=false;}));
});}

document.addEventListener('submit',e=>{
  e.preventDefault();

    const time=document.getElementById('r-time').value,altLoc=document.getElementById('r-alt').value.trim(),chart=paperRef(s,altLoc),row=document.getElementById('r-boxok').checked||altLoc?'confirmed':'',notes=document.getElementById('r-notes').value.trim(),self=document.getElementById('r-self').checked;

    if(m2){err.textContent=m2;err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return;}

      const [order,volS]=document.getElementById('st-bottle').value.split('|'),vol=Number(volS),fate=document.getElementById('st-fate').value,dRaw=document.getElementById('st-disp').value.trim();
      if(fate==='disposed'&&!/^\d+$/.test(dRaw))return fail('Enter roughly how much was left in the old bottle and disposed of (ml).');
      const pl=S.plans.find(x=>x.order===order&&x.state==='Current'),before=liquidState(order).inUse;
      S.stock[order].moves.push({at:now,type:'opened',vol,fate,disposedMl:fate==='disposed'?Number(dRaw):0,note,by:user.id,seq:++S.seq});
      log(now,user.name,`New bottle opened: ${person(pid).name} · ${pl.name} · ${vol} ml bottle. Old bottle (about ${before||0} ml by the running level): ${fate==='empty'?'empty':'about '+dRaw+' ml disposed of'}${note?' · '+note:''}`);
      if(fate==='empty'&&before>LIQ_TOL)log(now,'System',`Check: ${pl.name} for ${person(pid).name} was recorded as empty but the running level was about ${before} ml.`);
      toast(`Saved: ${vol} ml bottle of ${pl.name} opened.`);view={name:'person',pid};render();return;
    }
    const order=document.getElementById('st-order').value,qRaw=document.getElementById('st-qty').value.trim(),from=document.getElementById('st-from').value;
    const pl=S.plans.find(x=>x.order===order&&x.state==='Current'),liq=pl.unit==='ml',vEl=document.getElementById('st-vol'),vRaw=vEl?vEl.value.trim():'';
    if(!/^\d+$/.test(qRaw)||Number(qRaw)<=0)return fail(liq?'Enter the number of bottles as a whole number.':'Enter the quantity as a whole number.');
    if(liq&&(!/^\d+$/.test(vRaw)||Number(vRaw)<=0))return fail('For a liquid, enter the size of each bottle in ml (for example 200).');
    if(from.startsWith('Other')&&!note)return fail('Add a note saying where the stock came from or went.');
    const qty=Number(qRaw),vol=liq?Number(vRaw):null;
    if(!S.stock[order])S.stock[order]=liq?{liquid:true,cf:null,unopened:[],moves:[]}:{cf:0,moves:[]};
    if(liq&&type==='returned'){const have=liquidState(order).unopened.filter(v=>v===vol).length;if(have<qty)return fail(`Only ${have} unopened ${vol} ml bottle${have===1?' is':'s are'} recorded. Check the bottles and the size.`);}
    S.stock[order].moves.push({at:now,type,qty,vol,from,note,by:user.id,seq:++S.seq});
    const what=liq?`${qty} × ${vol} ml bottle${qty===1?'':'s'}`:`${qty} ${pl.unit}s`;
    log(now,user.name,`Stock ${type}: ${person(pid).name} · ${pl.name} · ${what} · ${from}${note?' · '+note:''}`);
    toast(`Saved: ${what} ${type}.${liq?'':' Balance now '+balance(order)+'.'}`);view={name:'person',pid};render();
  }
  if(f.id==='repform'){
    const what=document.getElementById('e-what').value.trim(),err=document.getElementById('e-err');
    if(!what){err.textContent='Describe what happened.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return;}
    const ev={pid:f.dataset.pid,type:document.getElementById('e-type').value,time:document.getElementById('e-time').value,what,done:document.getElementById('e-done').value.trim(),by:user.id,at:now};
    S.events.unshift(ev);log(now,user.name,`Event report: ${ev.type} · ${person(ev.pid).name} (sent to shift leader and manager)`);
    toast('Report sent to shift leader and manager');view={name:'person',pid:f.dataset.pid};render();
  }
  if(f.id==='chform'){
    const pid=f.dataset.pid,type=document.getElementById('c-type').value,err=document.getElementById('c-err');
    const g=id=>document.getElementById(id).value.trim();
    const prevEl=document.getElementById('c-prev'),photo=prevEl.dataset.src,photoKind=prevEl.dataset.kind||'image',photoName=prevEl.dataset.name||'';
    const rowsEls=[...document.querySelectorAll('#c-rows .trow')];
    const rowsData=rowsEls.map(r=>({t:r.querySelector('.c-time').value,d:r.querySelector('.c-dosetxt').value.trim()}));
    const times=rowsData.map(r=>r.t);
    const sched={},doseText={};rowsData.forEach(r=>{sched[r.t]=parseFloat(r.d);doseText[r.t]=r.d;});
    const dup=times.find((t,k)=>times.indexOf(t)!==k);
    const badDose=rowsData.find(r=>!r.d||!/^\d+(\.\d+)?/.test(r.d));
    const ld=document.getElementById('c-date').value;
    let msg='';
    if(type==='Add a medicine'&&(!g('c-name')||!g('c-strength')))msg='Enter the medicine name and strength.';
    else if(type!=='Stop a medicine'&&badDose)msg=badDose.d?`Start each dose with a number, as in the letter (for example "1 tablet" or "10 ml"). "${badDose.d}" doesn't.`:`Enter the dose for ${badDose.t}.`;
    else if(type!=='Stop a medicine'&&dup)msg=`${dup} is listed twice. Each time can only appear once.`;
    else if(!g('c-dr')||!g('c-surg')||!ld)msg='Enter the doctor\'s name, surgery and the date on the letter.';
    else if(ld>'2026-10-25')msg='The date on the letter can\'t be in the future.';
    else if(!photo)msg='The doctor\'s letter is required. Add a photo, scan or PDF of it.';
    else if(!document.getElementById('c-addr').checked)msg='The change can\'t be sent: the letter must be addressed to Oakwoods Care Group and signed and dated by the doctor.';
    if(msg){err.textContent=msg;err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return;}
    let order=null,medLabel,oldVid=null;
    if(type==='Add a medicine'){medLabel=g('c-name')+' '+g('c-strength');}
    else{order=g('c-order');const pl=S.plans.find(x=>x.order===order&&x.state==='Current');medLabel=pl.name+' '+pl.strength;oldVid=pl.vid;
      if(pendingFor(order)){err.textContent='A change for this medicine is already waiting for approval.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return;}}
    const c={id:'CHG-'+String(S.changes.length+1).padStart(3,'0'),pid,type,order,oldVid,medLabel,name:g('c-name'),strength:g('c-strength'),route:g('c-route')||'Oral',dose:times.map(t=>doseText[t]+' at '+t).join(', '),doseText,unitGuess:((rowsData[0]||{d:''}).d.replace(/^[\d.\s]+/,'').trim().toLowerCase().replace(/s$/,''))||'dose',times:times.sort((a,b)=>mins(a)-mins(b)),sched,dr:g('c-dr'),surg:g('c-surg'),date:ld?ld.split('-').reverse().join('/'):'',photo,photoKind,photoName,by:user.id,at:now,status:'Pending approval'};
    S.changes.push(c);
    log(now,user.name,`Prescription change sent for approval: ${person(pid).name} · ${type} · ${medLabel}`);
    toast('Sent for approval. Current prescription stays until approved.');view={name:'person',pid};render();
  }
  if(f.id==='apform'){
    const c=S.changes.find(x=>x.id===f.dataset.id),err=document.getElementById('k-err');
    if(!['k1','k2','k3'].every(k=>document.getElementById(k).checked)){err.textContent='Tick all three checks before approving.';err.hidden=false;err.scrollIntoView({block:'center',behavior:'smooth'});return;}
    applyChange(c);
    c.status='Approved';c.approver=user.id;c.decisionAt=now;c.comment=document.getElementById('k-c').value.trim();
    log(now,user.name,`Approved prescription change for ${person(c.pid).name} (${c.medLabel}). Second signature recorded.`);
    toast('Approved. The chart now shows the new prescription.');render();
  }
});

function applyChange(c){
  const future=s=>!s.entry&&mins(s.time)>now;
  if(c.type==='Add a medicine'){
    const order='ORD-'+String(S.plans.length+10).padStart(2,'0');
    const unit=c.unitGuess;
    const pl=P(order,1,c.pid,c.name,c.strength,c.route,'',c.sched,unit);S.plans.push(pl);
    c.times.filter(t=>mins(t)>now).forEach(t=>addSlot(pl,t));c.order=order;return;
  }
  const old=S.plans.find(x=>x.order===c.order&&x.state==='Current');
  S.slots.filter(s=>s.order===c.order&&!s.superseded&&future(s)).forEach(s=>{s.superseded=true;s.key+='#superseded#'+s.vid;});
  if(c.type==='Stop a medicine'){old.state='Stopped';return;}
  old.state='Superseded';
  // Old instructions are not carried over: they may contradict the new dose or times.
  const pl=P(old.order,old.v+1,old.pid,old.name,old.strength,old.route,'',c.sched,old.unit);S.plans.push(pl);
  c.times.filter(t=>mins(t)>now).forEach(t=>addSlot(pl,t));
}

(function(){const c=document.getElementById('clock');let o='';for(let m=6*60;m<=23*60;m+=60){o+=`<option value="${m}">Sun 25 Oct · ${fmt(m)}</option>`;if(m===20*60)o+=`<option value="${20*60+5}">Sun 25 Oct · 20:05 (handover)</option>`;}c.innerHTML=o;c.value=String(13*60);})();
now=13*60;seed();user=USERS[0];view={name:'today'};render();
})();
</script>
